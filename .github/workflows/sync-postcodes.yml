name: Sync Swedish postcode data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 2 * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-postcodes.yml"
      - "scripts/build_postcodes.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build postcode dataset
        run: python scripts/build_postcodes.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/data/postcodes-se.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert len(data["postcodes"]) >= 5000
          assert data["meta"]["source"].startswith("GeoNames")
          print(data["meta"])
          PY

      - name: Commit refreshed postcode data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/postcodes-se.json
          if git diff --cached --quiet; then
            echo "Postcode data unchanged"
          else
            git commit -m "Refresh Swedish postcode data"
            git pull --rebase
            git push
          fi
